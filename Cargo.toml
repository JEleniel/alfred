[package]
name = "alfred"
version = "0.1.0"
edition = "2024"

[package.metadata.crystultima]
app_id = "org.crystultima.alfred"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
config = "0.15.19"
dirs = "6.0.0"
escargot = "0.5.15"
fern = "0.7.1"
hex = "0.4.3"
hmac = "0.12.1"
imara-diff = "0.2.0"
log = "0.4.29"
mpatch = "1.3.5"
notify = "8.2.0"
num-traits = "0.2.19"
r2d2 = "0.8.10"
r2d2_sqlite = "0.32.0"
regex = "1.12.3"
rmcp = "0.16.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tantivy = "0.25.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
unicode-normalization = "0.1.25"
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
zip = "2.4.2"
